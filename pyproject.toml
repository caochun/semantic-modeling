[project]
name = "semantic-modeling-agent"
version = "0.1.0"
description = "从业务问题出发，基于证据逐步建立可复用知识的 agent 原型"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx[socks]>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "pypdf>=5,<7",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
semantic-agent = "semantic_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
